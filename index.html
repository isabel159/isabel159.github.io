<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Isabel Rodríguez · Backend &amp; AI Agent Engineer</title>
  <meta name="description" content="Portafolio de Isabel Esther Rodríguez Alvarez, Backend &amp; AI Agent Engineer. Casos de estudio de agentes de IA y backend en producción: arquitectura, tecnologías e implementación.">
  <meta name="author" content="Isabel Esther Rodríguez Alvarez">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Isabel Rodríguez · Backend &amp; AI Agent Engineer">
  <meta property="og:description" content="AI agents and Python/Azure backends in production · Case studies and resume (EN/ES).">
  <meta property="og:url" content="https://isabel159.github.io/">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f4e5f'/%3E%3Ctext x='32' y='42' font-family='Segoe UI,Arial,sans-serif' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3EIR%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="#/">Isabel <span>Rodríguez</span></a>
      <nav class="nav" id="nav"></nav>
      <div class="tools" id="tools"></div>
    </div>
  </header>

  <main class="wrap" id="app"></main>

  <footer>
    <div class="wrap">
      <span>© Isabel Esther Rodríguez Alvarez · Backend &amp; AI Agent Engineer</span>
      <span><a href="mailto:isabelestherr@gmail.com">Email</a> · <a href="https://github.com/isabel159" target="_blank" rel="noopener">GitHub</a> · <a id="footer-cv" href="cv/CV_Isabel_Rodriguez_ES.pdf" target="_blank">CV</a></span>
    </div>
  </footer>

  <script src="content.js"></script>
  <script src="content.en.js"></script>
  <script src="i18n.js"></script>
  <script src="render.js"></script>
  <script>
    (function () {
      const { profile, cases } = window.PORTFOLIO;
      const R = window.Render;
      const app = document.getElementById('app');
      const nav = document.getElementById('nav');
      const T = window.T;
      document.querySelector('meta[name="description"]').content = T.description;
      document.getElementById('footer-cv').href = T.cvPrimary.href;

      function renderNav(active) {
        nav.innerHTML =
          `<a href="#/" class="${active === 'home' ? 'active' : ''}">${T.home}</a>` +
          cases.map((c) => `<a href="#/proyecto/${c.slug}" class="${active === c.slug ? 'active' : ''}">${R.esc(c.name)}</a>`).join('');
        document.getElementById('tools').innerHTML =
          `<button type="button" id="lang" class="lang-btn" aria-label="${T.switchLabel}" title="${T.switchLabel}">${T.switchText}</button>` +
          `<button type="button" id="theme" aria-label="${T.theme}">◐</button>`;
        document.getElementById('theme').onclick = toggleTheme;
        document.getElementById('lang').onclick = window.switchLang;
      }

      function home() {
        renderNav('home');
        document.title = T.siteTitle;
        app.innerHTML = `
          <section class="hero">
            ${R.profileBlock(profile)}
            <div class="btns">
              <a class="btn" href="#proyectos">${T.viewProjects}</a>
              <a class="btn ghost" href="${T.cvPrimary.href}" target="_blank">${T.cvPrimary.text}</a>
              <a class="btn ghost" href="${T.cvSecondary.href}" target="_blank">${T.cvSecondary.text}</a>
              <a class="btn ghost" href="${T.portfolioPdf.href}" target="_blank">${T.portfolioPdf.text}</a>
              <a class="btn ghost" href="mailto:${profile.email}">${T.contact}</a>
            </div>
          </section>
          <section class="block" id="proyectos">
            <h2>${T.projects}</h2>
            <div class="projects">${cases.map(R.caseCard).join('')}</div>
          </section>
          <section class="block">
            <h2>${T.skills}</h2>
            ${R.skills(profile)}
          </section>
          <section class="block">
            <p class="note">${R.esc(profile.note)}</p>
          </section>`;
      }

      function project(slug) {
        const i = cases.findIndex((c) => c.slug === slug);
        if (i < 0) return home();
        const c = cases[i];
        const prev = cases[(i - 1 + cases.length) % cases.length];
        const next = cases[(i + 1) % cases.length];
        renderNav(slug);
        document.title = `${c.name} · Isabel Rodríguez`;
        app.innerHTML = R.caseBody(c) + `
          <nav class="case-nav">
            <a class="btn ghost" href="#/proyecto/${prev.slug}">← ${R.esc(prev.name)}</a>
            <a class="btn ghost" href="#/proyecto/${next.slug}">${R.esc(next.name)} →</a>
          </nav>`;
      }

      function route() {
        const m = location.hash.match(/^#\/proyecto\/([\w-]+)/);
        if (m) { project(m[1]); window.scrollTo(0, 0); }
        else if (location.hash === '#proyectos') { home(); document.getElementById('proyectos').scrollIntoView(); }
        else home();
      }

      function toggleTheme() {
        const root = document.documentElement;
        const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        root.dataset.theme = dark ? 'light' : 'dark';
        try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
      }
      try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

      // Ampliar capturas al hacer clic
      const lb = document.createElement('div');
      lb.className = 'lightbox'; lb.hidden = true; lb.innerHTML = '<img alt="">';
      document.body.appendChild(lb);
      lb.onclick = () => { lb.hidden = true; };
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lb.hidden = true; });
      app.addEventListener('click', (e) => {
        const a = e.target.closest('a[data-zoom]');
        if (!a) return;
        e.preventDefault();
        const img = a.querySelector('img');
        lb.querySelector('img').src = a.getAttribute('href');
        lb.querySelector('img').alt = img ? img.alt : '';
        lb.hidden = false;
      });

      window.addEventListener('hashchange', route);
      route();
    })();
  </script>
</body>
</html>
